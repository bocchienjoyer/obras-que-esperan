name: Actualizar inventario de obras

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dist/index.html"
      - "dist/buscador.js"
      - "dist/estilos.css"
      - "scripts/**"
      - "tests/test_actualizacion.py"
      - ".github/workflows/actualizar-inventario.yml"

concurrency:
  group: publicar-inventario
  cancel-in-progress: false

permissions: {}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar lector de anexos
        run: python -m pip install -r requirements.txt
      - name: Probar selección de fuente y validación
        run: python -m unittest discover -s tests -p 'test_actualizacion.py' -v
      - name: Consultar Contraloría
        run: python scripts/actualizar_inventario.py
      - name: Comprobar los archivos del buscador
        run: |
          node --check dist/obras.js
          node --check dist/buscador.js
      - name: Registrar el inventario verificado
        run: |
          if ! git diff --quiet -- dist/obras.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- dist/obras.js
            git commit -m 'Actualizar revisión del inventario de Contraloría'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preparar
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar el inventario verificado
        id: pages
        uses: actions/deploy-pages@v4
